[project]
name = "shinobi-cv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Richard-03", email = "berardi.2057533@studenti.uniroma1.it" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "keyboard>=0.13.5",
    "lark>=1.3.1",
    "mediapipe>=1.0.1",
    "nbconvert>=7.17.1",
    "pandas>=3.0.5",
    "pyaudio>=0.2.14",
    "pynput>=1.8.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.0",
    "torch>=2.14.0",
    "vosk>=0.3.45",
]

[project.scripts]
shinobi-cv = "shinobi_cv:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
